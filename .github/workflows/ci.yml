name: CI

on:
  push:
    branches: [main]
    tags: ["f*", "v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # release job uploads ISO assets on tags

env:
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    system-features = nixos-test benchmark big-parallel kvm
    flake-registry =

jobs:
  # ------------------------------------------------------------------------
  eval:
    name: Evaluate all hosts and GPU profiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Evaluation checks
        run: scripts/check.sh
      - name: GPU detection fixture tests
        run: tests/gpu-detect/run.sh
      - name: Installer dry run + evaluate generated configuration
        run: |
          cat > /tmp/answers.env <<'EOF'
          LOCALE=en_US.UTF-8
          KEYMAP=us
          TIMEZONE=UTC
          HOSTNAME=ci-dry-run
          USERNAME=tester
          FULLNAME=CI "Tester" ${x}
          PASSWORD=unused
          GPU_PROFILE=amd-gcn-legacy
          DESKTOP=yes
          DESKTOP_MODE=aero
          STEAM=yes
          FIRMWARE=uefi
          DISK_MODE=erase
          DISK=/dev/sdx
          CONFIRM_ERASE=/dev/sdx
          REBOOT=no
          EOF
          scripts/freutigo-install.sh --dry-run --answers /tmp/answers.env --source . --target /tmp/dry/etc/freutigo
          cat /tmp/dry/etc/freutigo/hosts/local/default.nix
          nix eval --raw /tmp/dry/etc/freutigo#nixosConfigurations.local.config.system.build.toplevel.drvPath

  # ------------------------------------------------------------------------
  lint:
    name: Lint (shellcheck, nixfmt)
    needs: eval
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: shellcheck
        run: nix build -L .#checks.x86_64-linux.shellcheck
      - name: gpu-detect check (sandboxed)
        run: nix build -L .#checks.x86_64-linux.gpu-detect
      - name: nixfmt (advisory until the tree is formatted once)
        continue-on-error: true
        run: nix build -L .#checks.x86_64-linux.nix-format

  # ------------------------------------------------------------------------
  vm-tests:
    name: VM test — ${{ matrix.test }}
    needs: eval
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test: [vmtest-core, vmtest-desktop]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: cachix/install-nix-action@v31
      - name: Run ${{ matrix.test }}
        run: nix build -L .#checks.x86_64-linux.${{ matrix.test }} -o result-test
      - name: Collect screenshots
        if: always()
        run: mkdir -p shots && cp -L result-test/*.png shots/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.test }}-screenshots
          path: shots/
          if-no-files-found: ignore

  # ------------------------------------------------------------------------
  iso:
    name: Build installer ISO
    needs: eval
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: cachix/install-nix-action@v31
      - name: Build ISO
        run: scripts/build-iso.sh
      - name: Show artifacts
        run: ls -la dist/ && cat dist/*.sha256 dist/*.buildinfo
      - uses: actions/upload-artifact@v4
        with:
          name: freutigo-iso
          path: dist/
          compression-level: 0
          retention-days: 30

  # ------------------------------------------------------------------------
  e2e:
    name: E2E install + reboot — ${{ matrix.name }}
    needs: iso
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: uefi-minimal
            args: --firmware uefi
          - name: bios-minimal
            args: --firmware bios
          - name: uefi-desktop
            args: --firmware uefi --desktop
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v4
        with:
          name: freutigo-iso
          path: dist/
      - name: Verify ISO checksum
        run: cd dist && sha256sum -c *.sha256
      - name: Run end-to-end installation test
        run: |
          ovmf=$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#OVMF.fd)
          export OVMF_CODE=$ovmf/FV/OVMF_CODE.fd OVMF_VARS=$ovmf/FV/OVMF_VARS.fd
          nix shell --inputs-from . nixpkgs#qemu_kvm nixpkgs#mtools nixpkgs#dosfstools -c \
            scripts/e2e-install-test.sh --iso "$(ls dist/*.iso | head -1)" ${{ matrix.args }} --workdir "$RUNNER_TEMP/e2e"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.name }}-logs
          path: |
            ${{ runner.temp }}/e2e/serial-*.log
            ${{ runner.temp }}/e2e/answers.env

  # ------------------------------------------------------------------------
  release:
    name: Publish release (tags only)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, vm-tests, iso, e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freutigo-iso
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" --prerelease \
            --title "Freutigo Aero OS ${GITHUB_REF_NAME} (development build)" \
            --notes "Development milestone ${GITHUB_REF_NAME}. CI-built and VM-tested; NOT tested on real hardware. See docs/DEVELOPMENT_LOG.md and docs/COMPATIBILITY.md."
